name: Deploy

# Berjalan setiap push ke master (atau manual), tanpa CI/tes. Membangun image, mendorong ke GHCR,
# lalu meminta Komodo men-deploy ulang stack.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/smkmuhbligo-app
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_APP_NAME=${{ vars.VITE_APP_NAME || 'SMK Muhammadiyah Bligo' }}

      - name: Deploy stack lewat Komodo
        env:
          KOMODO_URL: ${{ vars.KOMODO_URL }}
          KOMODO_STACK: ${{ vars.KOMODO_STACK }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$KOMODO_URL/execute" \
            -H "Content-Type: application/json" \
            -H "X-Api-Key: $KOMODO_API_KEY" \
            -H "X-Api-Secret: $KOMODO_API_SECRET" \
            -d "{\"type\":\"DeployStack\",\"params\":{\"stack\":\"$KOMODO_STACK\"}}"
