; =============================================================================
; Supervisor Configuration — Inertia SSR Server (SMK Muhammadiyah Bligo)
; Path  : /etc/supervisor/conf.d/smkmuhbligo-ssr.conf
; App   : /var/www/smkmuhbligo
; =============================================================================

[program:smkmuhbligo-ssr]

; ─── Command ─────────────────────────────────────────────────────────────────
command=php /var/www/smkmuhbligo/artisan inertia:start-ssr

; ─── Working Directory ───────────────────────────────────────────────────────
directory=/var/www/smkmuhbligo

; ─── Process Identity ────────────────────────────────────────────────────────
user=www-data

; ─── Single Process ──────────────────────────────────────────────────────────
numprocs=1
process_name=%(program_name)s

; ─── Autostart & Autorestart ──────────────────────────────────────────────────
autostart=true
autorestart=true

; ─── Graceful Shutdown ────────────────────────────────────────────────────────
stopasgroup=true
killasgroup=true
stopsignal=SIGINT

; ─── Logging ─────────────────────────────────────────────────────────────────
redirect_stderr=true
stdout_logfile=/var/log/smkmuhbligo-ssr.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
